# docker-compose.prod.yml (En tu servidor GCP e2-micro)
name: kinetic-reservations-prod

services:
  db:
    image: postgres:14-alpine
    container_name: kinetic-reservations-db-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
    volumes:
      - ./postgres:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME:-tu-usuario-docker}/kinetic-reservations-back:latest
    container_name: kinetic-reservations-back-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      db:
        condition: service_healthy
