# docker-compose.prod.yml (En tu servidor GCP)
name: kinetic-reservations-prod

services:
  db:
    image: postgres:14-alpine
    container_name: kinetic-reservations-db-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres 
      -c max_connections=20
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
    deploy:
      resources:
        limits:
          memory: 150M
    volumes:
      - ./postgres:/var/lib/postgresql/data

  backend:
    # Cambiamos "build:" por "image:" para descargar la imagen pre-construida de producción
    image: tu-usuario-docker/kinetic-reservations-back:latest 
    container_name: kinetic-reservations-back-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      - db
