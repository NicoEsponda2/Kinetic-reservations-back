# docker-compose.yml (Desarrollo Local)
name: kinetic-reservations-dev

services:
  db:
    image: postgres:14.3
    container_name: kinetic-reservations-db-dev
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # <--- Apunta a desarrollo local
    container_name: kinetic-reservations-back-dev
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CHOKIDAR_USEPOLLING=true
      - TSC_WATCHFILE=FixedPollingInterval
    volumes:
      - .:/app
      - kinetic_back_node_modules:/app/node_modules
    command: sh -c "rm -f tsconfig.build.tsbuildinfo && npm install && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kinetic_back_node_modules:
    name: kinetic-back-node-modules
